name: probe-cn-reach
on:
  push:
    paths:
      - '.github/workflows/probe-cn.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe domestic endpoints from GitHub runner
        run: |
          for u in \
            "https://www.55188.com/sec.php?action=overview" \
            "https://www.55188.com/sec.php?action=qxzb" \
            "https://dq.10jqka.com.cn/fuyao/hot_list_data/out/hot_list/v1/stock?stock_type=a&type=hour&list_type=normal" \
            "https://dq.10jqka.com.cn/fuyao/transaction_history/service/v1/get/33_002086.txt" \
            "https://raw.githubusercontent.com/jixiangying/finance-auto-gen/main/reports/2026-11-01-evening.md" ; do
            printf "%-105s " "$u"
            curl -s -o /dev/null -w "HTTP=%{http_code} time=%{time_total}s size=%{size_download}\n" --max-time 25 "$u" || echo "FAIL"
          done
